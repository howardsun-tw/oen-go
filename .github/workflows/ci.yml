name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 2 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: Go (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            go: ""
          - name: "1.27"
            go: "1.27.x"
          - name: latest
            go: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Report toolchain
        run: go version
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Verify a consumer module with the selected toolchain
        run: sh scripts/test-consumer.sh
